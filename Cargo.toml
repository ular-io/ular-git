[package]
name = "ular-git"
version = "0.1.0"
edition = "2021"
description = "k9s-style TUI to watch many git repositories, their worktrees, changed files, and diffs at a glance"
license = "MIT"
repository = "https://github.com/ular-io/ular-git"
homepage = "https://github.com/ular-io/ular-git"

[[bin]]
name = "ular-git"
path = "src/main.rs"

[lib]
name = "ular_git"
path = "src/lib.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "5"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
notify = "8.2.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
